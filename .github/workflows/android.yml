name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Java (required by Gradle) ─────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── Node ──────────────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ── Android SDK ───────────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # ── Frontend build ────────────────────────────────────────────────────────
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React app
        working-directory: frontend
        run: npm run build

      # ── Capacitor sync ────────────────────────────────────────────────────────
      - name: Add Android platform (initialises frontend/android project)
        working-directory: frontend
        run: npx cap add android

      - name: Capacitor sync (copy web assets into Android project)
        working-directory: frontend
        run: npx cap sync android

      # ── Gradle build ──────────────────────────────────────────────────────────
      - name: Make Gradle wrapper executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      # ── Upload artifact ───────────────────────────────────────────────────────
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: net-worth-tracker-debug-${{ github.sha }}
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ── Release build (tags only) ─────────────────────────────────────────────
      # Requires four repository secrets:
      #   KEYSTORE_BASE64    – base64-encoded release keystore file
      #                        (generate: keytool -genkey -v -keystore release.keystore
      #                                     -alias net-worth-tracker -keyalg RSA
      #                                     -keysize 2048 -validity 10000
      #                         encode:   base64 -w 0 release.keystore)
      #   KEYSTORE_PASSWORD  – keystore store password
      #   KEY_ALIAS          – key alias (e.g. net-worth-tracker)
      #   KEY_PASSWORD       – key password
      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > /tmp/release.keystore

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: frontend/android
        env:
          KEYSTORE_PATH: /tmp/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Remove release keystore from runner
        if: always()
        run: rm -f /tmp/release.keystore

      - name: Upload signed release APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: net-worth-tracker-release-${{ github.ref_name }}
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
